name: Собрать и опубликовать

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Собрать сайт из манифестов
        run: python build.py

      - name: Проверить базу
        run: python kb/check.py

      - name: Подготовить набор файлов для публикации
        run: |
          mkdir -p site
          rsync -a \
            --include='GLOSSARY.md' \
            --exclude='*.md' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            --exclude='learning-records' \
            --exclude='sources' \
            --exclude='*.pdf' \
            --exclude='site' \
            --exclude='*.py' \
            --exclude='__pycache__' \
            --exclude='kb/manifest.json' \
            --exclude='news/feed.json' \
            --exclude='news/digest.json' \
            --exclude='hub/agents.json' \
            . site/

      - name: Отправить на Beget по SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.BEGET_HOST }}
          REMOTE_PORT: ${{ secrets.BEGET_PORT }}
          REMOTE_USER: ${{ secrets.BEGET_USER }}
          TARGET: ${{ secrets.BEGET_PATH }}
          SOURCE: "site/"
          ARGS: "-avz --delete"
