name: Лента — сухой прогон сбора

# Пока только ручной запуск: Actions -> «Лента — сухой прогон сбора» -> Run workflow.
# Ничего не коммитит и не публикует — считает охват и складывает кандидатов
# в артефакт, чтобы можно было посмотреть глазами. Расписание появится здесь
# после того, как отбор и оценка будут настроены.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Один источник для отладки (youtube, feeds, hackernews, arxiv, reddit). Пусто — все."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: digest-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Собрать кандидатов
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python news/collect.py --out artifacts --only "${{ inputs.only }}"
          else
            python news/collect.py --out artifacts
          fi

      - name: Сохранить кандидатов артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
